services:
  - type: web
    name: etherface-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/face_verify.db
      - key: SKIP_CHAIN_DEPLOY
        value: "1"
      - key: FACE_BACKEND
        value: mediapipe
      - key: FACE_MATCH_TOLERANCE
        value: "0.6"
      - key: ADMIN_EMAIL
        value: admin@faceverify.local
      - key: ADMIN_NAME
        value: Local Administrator
      - key: FRONTEND_ORIGIN
        value: https://etherface.vercel.app
      - key: ADMIN_PASSWORD_HASH
        generateValue: false
    disk:
      name: etherface-data
      mountPath: /data
      sizeGB: 1
